<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:'Fredoka','Baloo 2',sans-serif;color:#5a2e55;background:#fff}

/* the paper */
#paintCanvas{position:fixed;inset:0;z-index:1;display:block;
  background:linear-gradient(160deg,#fffdf9 0%,#fff6fb 55%,#f7f0ff 100%)}

/* top-left back button (only chrome at the top — keeps the canvas clean) */
.back-link{position:fixed;top:calc(env(safe-area-inset-top,0) + 10px);left:10px;z-index:20;
  display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.8);
  border:1.5px solid rgba(255,20,147,.2);border-radius:24px;padding:8px 15px;text-decoration:none;
  color:#c2408e;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(255,20,147,.15)}
.back-link:active{transform:scale(.95)}

/* toolbar pinned to the bottom */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:8px 8px calc(env(safe-area-inset-bottom,0) + 8px);
  display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
.bar-row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;pointer-events:auto;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:2px solid rgba(255,105,180,.35);border-radius:22px;padding:7px 9px;box-shadow:0 6px 22px rgba(255,20,147,.2);max-width:100%}

.swatch{width:50px;height:50px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18);cursor:pointer;transition:transform .12s ease;flex:0 0 auto}
.swatch.sel{border-color:#333;transform:scale(1.18)}
.swatch:active{transform:scale(.9)}
.swatch.rainbow{background:conic-gradient(#ff1493,#ff8c00,#ffd23f,#6ddf6d,#3fb6ff,#9a4dff,#ff1493)}

.tool{width:50px;height:50px;border-radius:16px;border:3px solid #ffe0f0;background:#fff;cursor:pointer;
  font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;transition:transform .12s ease;flex:0 0 auto}
.tool.sel{border-color:#ff1493;background:#fff0f8;transform:scale(1.06)}
.tool:active{transform:scale(.9)}

.size-dot{display:flex;align-items:center;justify-content:center}
.size-dot i{display:block;border-radius:50%;background:#9a4dff}

/* stamp picker (only visible when the stamp tool is active) */
#stampRow{display:none}
#stampRow.show{display:flex}

/* text picker (only visible when the text tool is active) — for making greeting cards */
#textRow{display:none;flex-direction:column;gap:6px;align-items:center;max-width:340px}
#textRow.show{display:flex}
#textInput{font-family:'Fredoka',sans-serif;font-size:16px;border:2px solid #ff69b4;border-radius:14px;padding:8px 12px;width:260px;max-width:74vw;text-align:center;color:#ff1493;outline:none;background:#fff}
#textInput::placeholder{color:#ffa6d4}
.text-opts{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.font-btn,.tsize-btn{font-size:13px;border:2px solid #ffb6d9;border-radius:12px;padding:5px 12px;background:#fff;cursor:pointer;color:#ff1493;font-weight:700;white-space:nowrap;flex:0 0 auto}
.font-btn.active,.tsize-btn.active{background:linear-gradient(135deg,#ff69b4,#ff1493);color:#fff;border-color:#fff}
.text-hint{font-size:11px;color:#b06aff;font-weight:700}

.flash{position:fixed;pointer-events:none;font-size:20px;z-index:30;animation:flashUp .7s ease-out forwards}
@keyframes flashUp{0%{transform:translate(-50%,-50%) scale(.5);opacity:1}100%{transform:translate(-50%,-140%) scale(1.2);opacity:0}}

/* "Start over?" guard — so a stray tap can't wipe the whole picture */
.clear-confirm{position:fixed;inset:0;z-index:40;background:rgba(90,20,70,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.clear-card{background:#fff;border-radius:28px;padding:26px 24px;max-width:300px;width:100%;text-align:center;box-shadow:0 18px 50px rgba(255,20,147,.4);border:4px solid #ffd6ea;font-family:'Fredoka','Baloo 2',sans-serif}
.clear-emoji{font-size:48px;margin-bottom:6px}
.clear-title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:#ff1493;margin-bottom:4px}
.clear-desc{font-size:14px;color:#8a5a80;margin-bottom:16px;line-height:1.4}
.clear-no,.clear-yes{display:block;width:100%;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;border-radius:999px;padding:14px;cursor:pointer;border:none;margin-top:8px}
.clear-no{background:linear-gradient(135deg,#ff8ec4,#ff1493);color:#fff;box-shadow:0 8px 20px rgba(255,20,147,.35)}
.clear-yes{background:#f4e9f2;color:#9a5a85}
</style>

<body>
<canvas id="paintCanvas"></canvas>

<a class="back-link" href="play-hub.html">← Back</a>

<div id="bar">
  <div class="bar-row" id="stampRow">
    <!-- stamp emojis injected here -->
  </div>
  <div class="bar-row" id="textRow">
    <input id="textInput" type="text" maxlength="40" placeholder="Type your words…" autocomplete="off">
    <div class="text-opts" id="fontOpts"></div>
    <div class="text-opts" id="tsizeOpts"></div>
    <div class="text-hint">Now tap the card to place it ✨</div>
  </div>
  <div class="bar-row" id="colorRow">
    <!-- color swatches injected here -->
  </div>
  <div class="bar-row" id="toolRow">
    <button class="tool sel" id="tBrush"  type="button" title="Brush">🖌️</button>
    <button class="tool"     id="tText"   type="button" title="Text"><span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;color:#ff1493;line-height:1">Aa</span></button>
    <button class="tool"     id="tStamp"  type="button" title="Stamps">⭐</button>
    <button class="tool"     id="tEraser" type="button" title="Eraser">🧽</button>
    <button class="tool size-dot" id="tSize" type="button" title="Brush size"><i style="width:16px;height:16px"></i></button>
    <button class="tool"     id="tUndo"   type="button" title="Undo">↩️</button>
    <button class="tool"     id="tClear"  type="button" title="Start over">🗑️</button>
    <button class="tool"     id="tSave"   type="button" title="Save" style="border-color:#ff1493;background:linear-gradient(135deg,#ff8ec4,#ff1493)">💾</button>
  </div>
</div>

<div id="clearConfirm" class="clear-confirm" style="display:none">
  <div class="clear-card">
    <div class="clear-emoji">🗑️</div>
    <div class="clear-title">Start over?</div>
    <div class="clear-desc">This clears your whole picture.</div>
    <button type="button" class="clear-no" id="clearNo">No, keep my picture 💖</button>
    <button type="button" class="clear-yes" id="clearYes">Yes, start over</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('paintCanvas');
  const ctx = canvas.getContext('2d');

  // ── auto-save: never lose a painting to a stray tap or accidental exit ──
  const SAVE_KEY = 'sp_paint_canvas';
  let _saveT = null;
  function autoSave(){
    clearTimeout(_saveT);
    _saveT = setTimeout(function(){
      try { localStorage.setItem(SAVE_KEY, canvas.toDataURL('image/png')); } catch(e){}
    }, 500);
  }
  function restoreSaved(){
    let data = null; try { data = localStorage.getItem(SAVE_KEY); } catch(e){}
    if (!data) return;
    const img = new Image();
    img.onload = function(){ try { ctx.drawImage(img, 0, 0); } catch(e){} };
    img.src = data;
  }

  // Resizing a canvas clears it — preserve the artwork across resizes
  // (e.g. rotating the device or the browser bars showing/hiding).
  function resize(){
    const w = innerWidth, h = innerHeight;
    if (canvas.width === w && canvas.height === h) return;
    let snap = null;
    try { if (canvas.width && canvas.height) snap = ctx.getImageData(0,0,canvas.width,canvas.height); } catch(e){}
    canvas.width = w; canvas.height = h;
    if (snap){ try{ ctx.putImageData(snap,0,0); }catch(e){} }
  }
  addEventListener('resize', resize); resize();
  restoreSaved();   // bring back the painting from last time

  const SIZES = [8, 16, 28];
  const state = { tool:'brush', color:'#ff1493', size:16, sizeIdx:1, hue:0, drawing:false, lastX:0, lastY:0,
                  stamp:'⭐', text:'', font:"'Fredoka', sans-serif", fontSize:56 };

  // ── undo history ──
  const undo = [];
  function pushUndo(){
    try{ undo.push(ctx.getImageData(0,0,canvas.width,canvas.height)); }catch(e){}
    if (undo.length > 18) undo.shift();
  }

  // ── drawing ──
  function lineTo(x, y){
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = state.size;
    if (state.tool === 'eraser'){
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
    } else {
      ctx.globalCompositeOperation = 'source-over';
      if (state.color === 'rainbow'){ state.hue = (state.hue + 6) % 360; ctx.strokeStyle = 'hsl('+state.hue+',85%,60%)'; }
      else ctx.strokeStyle = state.color;
    }
    ctx.beginPath();
    ctx.moveTo(state.lastX, state.lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
    state.lastX = x; state.lastY = y;
  }

  function placeStamp(x, y){
    ctx.globalCompositeOperation = 'source-over';
    ctx.save();
    ctx.font = (state.size * 2.6) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(state.stamp, x, y);
    ctx.restore();
    sparkle(x, y);
  }

  function placeText(x, y){
    const t = (state.text || '').trim();
    if (!t) return;
    ctx.globalCompositeOperation = 'source-over';
    ctx.save();
    ctx.font = 'bold ' + state.fontSize + 'px ' + state.font;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // white outline so words pop on any colour — like the old greeting-card text
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText(t, x, y);
    ctx.fillStyle = state.color === 'rainbow'
      ? 'hsl('+(state.hue = (state.hue + 40) % 360)+',100%,55%)'
      : state.color;
    ctx.fillText(t, x, y);
    ctx.restore();
    sparkle(x, y);
  }

  function pointFromEvent(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener('pointerdown', function(e){
    e.preventDefault();
    const p = pointFromEvent(e);
    pushUndo();
    if (state.tool === 'stamp'){ placeStamp(p.x, p.y); autoSave(); return; }
    if (state.tool === 'text'){ placeText(p.x, p.y); const ti=document.getElementById('textInput'); if(ti) ti.blur(); autoSave(); return; }
    state.drawing = true; state.lastX = p.x; state.lastY = p.y;
    lineTo(p.x + 0.01, p.y + 0.01); // a dot on a single tap
  });
  canvas.addEventListener('pointermove', function(e){
    if (!state.drawing) return;
    e.preventDefault();
    // smooth: use coalesced events when available
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of evs){ const p = pointFromEvent(ev); lineTo(p.x, p.y); }
  });
  function endStroke(){ state.drawing = false; ctx.globalCompositeOperation = 'source-over'; autoSave(); }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  canvas.addEventListener('pointerleave', endStroke);

  function sparkle(x, y){
    const el = document.createElement('div'); el.className = 'flash'; el.textContent = '✨';
    el.style.left = x + 'px'; el.style.top = y + 'px';
    document.body.appendChild(el); setTimeout(()=>el.remove(), 700);
  }

  // ── colors ── ('rainbow' cycles through every colour, for the brush AND for text)
  const COLORS = ['rainbow','#ff1493','#ff5ba0','#ff8c42','#ffd23f','#6ddf6d','#3fb6ff','#9a4dff','#8a5a44','#333333','#ffffff'];
  const colorRow = document.getElementById('colorRow');
  COLORS.forEach(function(c, i){
    const s = document.createElement('button'); s.type='button';
    const isRainbow = (c === 'rainbow');
    s.className='swatch'+(isRainbow?' rainbow':'')+(c===state.color?' sel':'');
    if (!isRainbow) s.style.background = c;
    if (isRainbow) s.title = 'Rainbow';
    s.addEventListener('click', function(){
      state.color = c;
      // choosing a color implies you want to draw/write, not erase or stamp
      if (state.tool === 'eraser' || state.tool === 'stamp') selectTool('brush');
      Array.from(colorRow.children).forEach(x=>x.classList.remove('sel'));
      s.classList.add('sel');
    });
    colorRow.appendChild(s);
  });

  // ── stamps ──
  const STAMPS = ['⭐','💖','🦄','🌈','🌸','🦋','🐱','🌙','🍭','👑'];
  const stampRow = document.getElementById('stampRow');
  STAMPS.forEach(function(em, i){
    const s = document.createElement('button'); s.type='button'; s.className='tool'+(i===0?' sel':'');
    s.textContent = em;
    s.addEventListener('click', function(){
      state.stamp = em;
      Array.from(stampRow.children).forEach(x=>x.classList.remove('sel'));
      s.classList.add('sel');
    });
    stampRow.appendChild(s);
  });

  // ── text picker (fonts + sizes for making greeting cards) ──
  const textRow = document.getElementById('textRow');
  const textInput = document.getElementById('textInput');
  textInput.addEventListener('input', function(e){ state.text = e.target.value; });
  textInput.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
  const FONTS = [
    { label:'Round',  css:"'Fredoka', sans-serif" },
    { label:'Chunky', css:"'Baloo 2', cursive" },
    { label:'Comic',  css:"'Comic Sans MS', 'Baloo 2', cursive" },
    { label:'Fancy',  css:"'Brush Script MT', cursive" }
  ];
  const TEXT_SIZES = [ {label:'Small',px:34}, {label:'Medium',px:56}, {label:'Big',px:84} ];
  const fontOpts = document.getElementById('fontOpts');
  FONTS.forEach(function(f, i){
    const b = document.createElement('button'); b.type='button';
    b.className = 'font-btn'+(i===0?' active':''); b.textContent = f.label; b.style.fontFamily = f.css;
    b.addEventListener('click', function(){
      Array.from(fontOpts.children).forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); state.font = f.css;
    });
    fontOpts.appendChild(b);
  });
  const tsizeOpts = document.getElementById('tsizeOpts');
  TEXT_SIZES.forEach(function(s, i){
    const b = document.createElement('button'); b.type='button';
    b.className = 'tsize-btn'+(i===1?' active':''); b.textContent = s.label;
    b.addEventListener('click', function(){
      Array.from(tsizeOpts.children).forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); state.fontSize = s.px;
    });
    tsizeOpts.appendChild(b);
  });

  // ── tools ──
  const toolBtns = { brush:'tBrush', text:'tText', stamp:'tStamp', eraser:'tEraser' };
  function selectTool(name){
    state.tool = name;
    Object.entries(toolBtns).forEach(function(pair){
      document.getElementById(pair[1]).classList.toggle('sel', pair[0]===name);
    });
    stampRow.classList.toggle('show', name==='stamp');
    textRow.classList.toggle('show', name==='text');
    if (name==='text') setTimeout(function(){ textInput.focus(); }, 50);
  }
  document.getElementById('tBrush').addEventListener('click', ()=>selectTool('brush'));
  document.getElementById('tText').addEventListener('click', ()=>selectTool('text'));
  document.getElementById('tStamp').addEventListener('click', ()=>selectTool('stamp'));
  document.getElementById('tEraser').addEventListener('click', ()=>selectTool('eraser'));

  // brush size cycles small → medium → big
  const sizeDot = document.querySelector('#tSize i');
  document.getElementById('tSize').addEventListener('click', function(){
    state.sizeIdx = (state.sizeIdx + 1) % SIZES.length;
    state.size = SIZES[state.sizeIdx];
    const d = 10 + state.sizeIdx*6;
    sizeDot.style.width = d+'px'; sizeDot.style.height = d+'px';
  });

  document.getElementById('tUndo').addEventListener('click', function(){
    if (!undo.length) return;
    const img = undo.pop();
    try{ ctx.putImageData(img, 0, 0); }catch(e){}
    autoSave();
  });

  // "Start over" asks first — one stray tap should never wipe a whole painting.
  const clearConfirm = document.getElementById('clearConfirm');
  document.getElementById('tClear').addEventListener('click', function(){
    clearConfirm.style.display = 'flex';
  });
  document.getElementById('clearNo').addEventListener('click', function(){
    clearConfirm.style.display = 'none';
  });
  document.getElementById('clearYes').addEventListener('click', function(){
    clearConfirm.style.display = 'none';
    pushUndo();
    ctx.clearRect(0,0,canvas.width,canvas.height);
    autoSave();
  });

  // ── save / share ──
  document.getElementById('tSave').addEventListener('click', function(){
    const pad = 60;
    const off = document.createElement('canvas');
    off.width = canvas.width; off.height = canvas.height + pad;
    const octx = off.getContext('2d');
    octx.fillStyle = '#fff'; octx.fillRect(0,0,off.width,off.height);
    octx.drawImage(canvas, 0, 0);
    octx.textAlign = 'center';
    octx.fillStyle = '#ff1493'; octx.font = "bold 22px 'Baloo 2', sans-serif";
    octx.fillText('Made with ✨ SparklePop', off.width/2, canvas.height + 26);
    octx.fillStyle = '#9a4dff'; octx.font = "bold 15px 'Baloo 2', sans-serif";
    octx.fillText('sparklespop.com · 📷 @sparklespop4', off.width/2, canvas.height + 48);
    const dataUrl = off.toDataURL('image/png');
    fetch(dataUrl).then(r=>r.blob()).then(function(blob){
      const file = new File([blob], 'my-sparklepop-painting.png', { type:'image/png' });
      if (navigator.canShare && navigator.canShare({ files:[file] })){
        navigator.share({ files:[file], title:'My SparklePop Painting', text:'Made with SparklePop! sparklespop.com' }).catch(()=>dl(dataUrl));
      } else dl(dataUrl);
    }).catch(()=>dl(dataUrl));
    function dl(u){ const a=document.createElement('a'); a.href=u; a.download='my-sparklepop-painting.png'; document.body.appendChild(a); a.click(); a.remove(); }
  });
})();
</script>

<!-- ── 15-minute play reminder (shared across play surfaces) ── -->
<div id="spTimerOverlay" class="sp-timer-overlay" style="display:none">
  <div class="sp-timer-card">
    <div class="sp-timer-unicorn">🦄</div>
    <div class="sp-timer-title">You played for 15 minutes! 🎉</div>
    <div class="sp-timer-desc">Here's the magic you learnt today ✨</div>
    <div class="sp-fact-list" id="spFactList"></div>
    <a class="sp-timer-btn" id="spTimerOkBtn" href="index.html">Show Mummy! 💖</a>
  </div>
</div>
<style>
.sp-timer-overlay{position:fixed;inset:0;z-index:99999;background:rgba(90,20,70,.5);display:flex;align-items:center;justify-content:center;padding:20px;animation:spFadeIn .3s ease}
@keyframes spFadeIn{from{opacity:0}to{opacity:1}}
.sp-timer-card{background:#fff;border-radius:32px;padding:32px 28px;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(255,20,147,.4);border:5px solid #ffd6ea;font-family:'Fredoka','Baloo 2',sans-serif}
.sp-timer-unicorn{font-size:64px;animation:spBob 1.6s ease-in-out infinite;filter:drop-shadow(0 8px 20px rgba(255,20,147,.4))}
@keyframes spBob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.sp-timer-title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:#ff1493;margin:10px 0 6px}
.sp-timer-desc{font-size:14px;color:#8a5a80;line-height:1.5;margin-bottom:14px}
.sp-fact-list{text-align:left;margin:0 0 18px;display:flex;flex-direction:column;gap:8px;max-height:38vh;overflow-y:auto}
.sp-fact{background:#fff0f8;border:1.5px solid #ffd6ea;border-radius:14px;padding:9px 12px;font-size:14px;color:#5a2e55;line-height:1.4;font-weight:600}
.sp-timer-btn{display:inline-block;text-decoration:none;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;background:linear-gradient(135deg,#ff8ec4,#ff1493);color:#fff;border:none;padding:12px 30px;border-radius:999px;cursor:pointer;box-shadow:0 8px 20px rgba(255,20,147,.35)}
</style>
<script>
(function(){
  var DURATION = 15*60*1000;   // 15 minutes of play, then playtime is over
  var REST     = 60*60*1000;   // rest this long before play unlocks again
  var KEY  = 'sp_session_start';
  var FKEY = 'sp_session_facts';
  var now = Date.now();
  var start = parseInt(localStorage.getItem(KEY) || '0', 10);

  // Fresh session if never started, or the rest period is fully over.
  if (!start || (now - start) >= (DURATION + REST)) {
    start = now;
    localStorage.setItem(KEY, String(start));
    localStorage.removeItem(FKEY);   // new session -> forget old facts
  }

  // Always have something magical to teach, even if no eggs were opened.
  var BACKUP_FACTS = [
    "Butterflies taste with their feet! Wow!",
    "Bees make sweet honey for us. Yum yum!",
    "The moon shines at night to say goodnight!",
    "Snails move very very slowly. So slow!",
    "A baby cow is called a calf. Moo!"
  ];
  function facts(){
    try { var a = JSON.parse(localStorage.getItem(FKEY) || '[]'); return Array.isArray(a) ? a : []; }
    catch(e){ return []; }
  }
  function chime(){
    try{
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      [660, 880].forEach(function(freq, i){
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = freq;
        g.gain.value = 0.0001;
        o.connect(g); g.connect(ctx.destination);
        var t = ctx.currentTime + i * 0.18;
        g.gain.exponentialRampToValueAtTime(0.05, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
        o.start(t); o.stop(t + 0.32);
      });
    }catch(e){}
  }
  var _voices = [];
  function _loadVoices(){ try { _voices = (window.speechSynthesis && speechSynthesis.getVoices()) || []; } catch(e){} }
  _loadVoices();
  if (window.speechSynthesis) { try { speechSynthesis.addEventListener('voiceschanged', _loadVoices); } catch(e){} }
  function speak(text){
    try{
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.85; u.pitch = 1.12; u.volume = 0.9;
      var prefs = [/Samantha/i,/Google US English/i,/Google UK English Female/i,/Karen/i,/Victoria/i,/female/i];
      for (var i=0;i<prefs.length;i++){ var v=_voices.find(function(x){ return prefs[i].test(x.name); }); if(v){ u.voice=v; break; } }
      speechSynthesis.speak(u);
    }catch(e){}
  }
  function endPlaytime(){
    var overlay = document.getElementById('spTimerOverlay');
    if (!overlay || overlay.style.display === 'flex') return;
    var list = facts();
    if (!list.length) list = [ BACKUP_FACTS[Math.floor(Math.random() * BACKUP_FACTS.length)] ];
    list = list.slice(0, 6);
    var box = document.getElementById('spFactList');
    if (box){
      box.innerHTML = '';
      list.forEach(function(f){
        var d = document.createElement('div');
        d.className = 'sp-fact';
        d.textContent = '✨ ' + f;
        box.appendChild(d);
      });
    }
    overlay.style.display = 'flex';
    chime();
    speak('You played for fifteen minutes! Here is the magic you learnt today. ' + list.join('. '));
  }
  document.addEventListener('DOMContentLoaded', function(){
    var elapsed = Date.now() - start;
    if (elapsed >= DURATION) {
      endPlaytime();                                // time already used up -> locked recap
    } else {
      setTimeout(endPlaytime, DURATION - elapsed);  // lock the moment 15 min runs out
    }
  });
})();
</script>
</body>
</html>
